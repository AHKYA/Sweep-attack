name: Build SweepAttack

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download PowerNukkitX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 3.0.5 --repo PowerNukkitX/PowerNukkitX --pattern '*.jar'
          ls -la *.jar

      - name: Compile
        run: |
          mkdir out
          javac -cp powernukkitx.jar -d out src/id/rivai/sweep/SweepPlugin.java
          cp plugin.yml out/
          jar cf SweepAttack.jar -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: SweepAttack
          path: SweepAttack.jar
